<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Problema-2</title>
</head>
<body>

<h4>Formular de feedback:</h4>

<label for="name">Nume: </label>
<input type="text" id="name" name="name">
<label for="dateOfBirth">Data nasterii:</label>
<input type="date" id="dateOfBirth" name="dateOfBirth">
<label for="email">Email:</label>
<input type="text" id="email" name="email">
<button onclick="submitForm()">Trimite</button>
<br>
<label id="validationResponse"></label>
<p> Pentru a trimite un formular valid, trebuie sa respecte conditiile:
    <ol>
        <li>Numele sa aiba o lungime mai mare de 4 litere.</li>
        <li>Sa fie o data selectata.</li>
        <li>Sa fie introdus un email, mai lung de 9 caractere.</li>
    </ol>
</p>

<script>
    function submitForm() {
        const name = document.getElementById('name').value;
        const dateOfBirth = document.getElementById('dateOfBirth').value;
        const email = document.getElementById('email').value;

        const dateInput = document.getElementById('dateOfBirth');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');


        [nameInput, dateInput, emailInput].forEach(element => {
            element.style.borderWidth = '1px';
            element.style.borderColor = 'black';

        });

        var validationStatus = true;
        var validationErrors = "Va rugam sa verificati campurile:"
        if (name == '' || name.length < 5) {

            nameInput.style.borderColor = 'red';
            nameInput.style.borderWidth = '3px'
            validationStatus = false;
            validationErrors += "Nume, ";
        }

        if (dateOfBirth == '') {
            dateInput.style.borderColor = 'red';
            dateInput.style.borderWidth = '3px'
            validationStatus = false;
            validationErrors += "Data Nasterii, ";
        } else {
        }

        if (email.length < 10 || email == '') {
            emailInput.style.borderColor = 'red';
            emailInput.style.borderWidth = '3px'
            validationStatus = false;
            validationErrors += "Email. ";
        }
        const label = document.getElementById('validationResponse');
        if (!validationStatus) {
            label.textContent = validationErrors;
            label.style.color = 'red';
        }
        else
            {
                label.textContent="Formularul a fost trimis cu succes!";
                label.style.color = 'green';
                dateInput.value=''
                nameInput.value='';
                emailInput.value='';
            }
        }
</script>

</body>
</html>
