<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Parking Spaces - {{ username }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Search Bar -->
  <ion-searchbar
    [(ngModel)]="searchQuery"
    (ionInput)="filterSpaces()"
    placeholder="Search by number"
    debounce="300"
  ></ion-searchbar>

  <!-- Loading Indicator -->
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner></ion-spinner>
    <p>Loading parking spaces...</p>
  </div>

  <!-- Error Message with Retry -->
  <div *ngIf="error && !isLoading" class="error-container">
    <ion-text color="danger">
      <p>{{ error }}</p>
    </ion-text>
    <ion-button expand="block" (click)="retryLoad()" color="primary">
      <ion-icon slot="start" name="refresh-outline"></ion-icon>
      Retry
    </ion-button>
  </div>

  <!-- Parking Spaces List -->
  <ion-list *ngIf="!isLoading && filteredSpaces.length > 0">
    <ion-item
      *ngFor="let space of filteredSpaces"
      [color]="getSpaceColor(space)"
      button
      (click)="toggleSpace(space.id)"
    >
      <ion-label>
        <h2>{{ space.number }}</h2>
        <p *ngIf="!space.takenBy">Available</p>
        <p *ngIf="space.takenBy && space.takenBy === username">Taken by you</p>
        <p *ngIf="space.takenBy && space.takenBy !== username">Taken by {{ space.takenBy }}</p>
      </ion-label>

      <!-- Expanded Actions -->
      <div *ngIf="isExpanded(space.id)" class="space-actions">

        <!-- Take Button -->
        <ion-button
          *ngIf="canTakeSpace(space)"
          expand="block"
          (click)="takeSpace(space); $event.stopPropagation()"
          [disabled]="updatingSpaceId === space.id"
          color="success"
        >
          <ion-spinner *ngIf="updatingSpaceId === space.id" slot="start"></ion-spinner>
          Take
        </ion-button>

        <!-- Release Button -->
        <ion-button
          *ngIf="canReleaseSpace(space)"
          expand="block"
          (click)="releaseSpace(space); $event.stopPropagation()"
          [disabled]="updatingSpaceId === space.id"
          color="warning"
        >
          <ion-spinner *ngIf="updatingSpaceId === space.id" slot="start"></ion-spinner>
          Release
        </ion-button>

        <!-- Error Message with Retry for Update -->
        <div *ngIf="updateError[space.id]" class="update-error">
          <ion-text color="danger">
            <p>{{ updateError[space.id] }}</p>
          </ion-text>
          <ion-button
            size="small"
            (click)="retryUpdate(space); $event.stopPropagation()"
            [disabled]="updatingSpaceId === space.id"
          >
            <ion-icon slot="start" name="refresh-outline"></ion-icon>
            Retry
          </ion-button>
        </div>
      </div>
    </ion-item>
  </ion-list>

  <!-- No Results -->
  <div *ngIf="!isLoading && filteredSpaces.length === 0 && spaces.length > 0" class="no-results">
    <ion-text color="medium">
      <p>No parking spaces found.</p>
    </ion-text>
  </div>

</ion-content>
