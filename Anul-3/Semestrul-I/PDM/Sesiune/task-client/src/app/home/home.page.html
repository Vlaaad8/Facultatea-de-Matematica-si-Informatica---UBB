<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      {{ viewMode === 'tags' ? 'Task Tags' : selectedTag }}
    </ion-title>
    <ion-buttons slot="start" *ngIf="viewMode === 'tasks'">
      <ion-button (click)="onReturn()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Loading indicator -->
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner></ion-spinner>
    <p>Loading tasks...</p>
  </div>

  <!-- Tags view -->
  <ion-list *ngIf="viewMode === 'tags' && !isLoading">
    <ion-item *ngFor="let tag of tags" (click)="onTagClick(tag.tag)" button>
      <ion-label>
        {{ tag.tag }}
        <span *ngIf="tag.unreadCount > 0" class="badge">[{{ tag.unreadCount }}]</span>
      </ion-label>
      <ion-icon slot="end" name="chevron-forward"></ion-icon>
    </ion-item>
  </ion-list>

  <!-- Tasks view -->
  <ion-list *ngIf="viewMode === 'tasks' && !isLoading">
    <ion-item
      *ngFor="let task of tasks"
      (click)="onTaskClick(task)"
      button
      [color]="getTaskColor(task)">
      <ion-label>
        <h2>Task {{ task.id }}</h2>
        <p>{{ getTaskDisplayText(task) }}</p>
      </ion-label>
      <ion-badge
        slot="end"
        *ngIf="!task.isRead && !task.sendStatus"
        color="primary">
        New
      </ion-badge>
    </ion-item>
  </ion-list>

  <!-- Empty state -->
  <div class="empty-state" *ngIf="!isLoading && viewMode === 'tasks' && tasks.length === 0">
    <ion-icon name="document-outline" size="large"></ion-icon>
    <p>No tasks found for this tag</p>
  </div>
</ion-content>
