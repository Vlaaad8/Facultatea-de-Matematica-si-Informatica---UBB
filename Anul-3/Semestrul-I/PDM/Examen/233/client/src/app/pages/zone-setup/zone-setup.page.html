<ion-header>
  <ion-toolbar>
    <ion-title>Zone Setup</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="zone-setup-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Set Your Audit Zone</ion-card-title>
        <ion-card-subtitle>
          This will be your permanent audit zone and cannot be changed later.
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Zone Name</ion-label>
          <ion-input
            [(ngModel)]="zone"
            placeholder="Enter zone name (e.g., Warehouse A, Section B1)"
            type="text"
            [disabled]="isLoading">
          </ion-input>
        </ion-item>

        <ion-button
          expand="block"
          (click)="setZone()"
          [disabled]="!zone.trim() || isLoading"
          class="ion-margin-top">
          <ion-spinner *ngIf="isLoading" name="circular"></ion-spinner>
          <span *ngIf="!isLoading">Set Zone</span>
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
