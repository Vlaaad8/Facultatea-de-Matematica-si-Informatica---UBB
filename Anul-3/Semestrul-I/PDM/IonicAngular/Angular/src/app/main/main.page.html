<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Movie App</ion-title>
    <ion-item *ngIf="nList.length!==1" slot="end">
      <ion-label (click)="setOpen(true)">Notifications </ion-label>
      <ion-badge color="primary">{{ nList.length }}</ion-badge>
    </ion-item>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true" *ngIf="data.length!==0; else loading">
  <ion-list>
    <ion-item *ngFor="let movie of data">
    <ion-label> {{movie.name}}</ion-label>
      <ion-button (click)="handleMovie(movie)"><ion-icon name="arrow-forward"></ion-icon> </ion-button>
    </ion-item>
  </ion-list>
  <ion-infinite-scroll threshold="15%" (ionInfinite)="onIonInfinite($event)" *ngIf="!hasAll">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Loading more movies...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>


<ng-template #loading>
  <div class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading movie details...</p>
  </div>
</ng-template>


<ion-modal [isOpen]="isModalOpen">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Modal</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="setOpen(false)">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-list-header>Notifications</ion-list-header>
        <ion-item *ngFor="let n of nList;">
          <p>{{n.title}}</p>
          <p>{{n.message}}</p>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
