<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Warehouse Audit
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Warehouse Audit</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Zone Setup Section -->
  <div *ngIf="!zoneSet" class="zone-setup">
    <ion-item>
      <ion-label position="floating">Enter Zone</ion-label>
      <ion-input [(ngModel)]="zone" type="text" placeholder="e.g., Zone A"></ion-input>
    </ion-item>
    <ion-button expand="block" (click)="setZone()" [disabled]="!zone.trim()">
      Set Zone
    </ion-button>
  </div>

  <!-- Loading Indicator -->
  <div *ngIf="zoneSet && isLoading" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading inventory from server...</p>
  </div>

  <!-- Inventory Section -->
  <div *ngIf="zoneSet && !isLoading">
    <div class="zone-info">
      <p><strong>Zone:</strong> {{ zone }}</p>
    </div>

    <!-- Filter Segment -->
    <ion-segment [(ngModel)]="filter" (ionChange)="onFilterChange($event)">
      <ion-segment-button value="all">
        <ion-label>All Items</ion-label>
      </ion-segment-button>
      <ion-segment-button value="discrepancies">
        <ion-label>Discrepancies</ion-label>
      </ion-segment-button>
    </ion-segment>

    <!-- Inventory List -->
    <ion-list>
      <ion-item *ngFor="let item of filteredItems">
        <ion-label (click)="selectItem(item)">
          <h2>{{ item.name }}</h2>
          <p>System Stock: {{ item.quantity }}</p>
          <p *ngIf="item.counted !== undefined && !item.isEditing"
             [ngClass]="{'error-text': item.hasError, 'success-text': item.sentToServer && !item.hasError}">
            Counted: {{ item.counted }}
            <ion-icon *ngIf="item.sentToServer && !item.hasError" name="checkmark" color="success"></ion-icon>
            <ion-icon *ngIf="item.hasError" name="close" color="danger"></ion-icon>
          </p>
          <p *ngIf="item.errorMessage" class="error-message">
            {{ item.errorMessage }}
          </p>
        </ion-label>

        <!-- Edit Mode -->
        <div *ngIf="item.isEditing" slot="end" class="edit-container">
          <ion-input
            type="number"
            [value]="item.counted"
            #countInput
            (keyup.enter)="confirmCount(item, countInput.value)"
            placeholder="Enter count">
          </ion-input>
          <ion-button size="small" (click)="confirmCount(item, countInput.value)">
            OK
          </ion-button>
          <ion-button size="small" fill="clear" (click)="cancelEdit(item)">
            Cancel
          </ion-button>
        </div>

        <!-- Progress Indicator -->
        <ion-spinner *ngIf="item.isSending" slot="end" name="dots"></ion-spinner>
      </ion-item>
    </ion-list>

    <!-- Audit Complete Button -->
    <div class="button-container">
      <ion-button expand="block" (click)="auditComplete()" color="primary">
        Audit Complete
      </ion-button>
    </div>
  </div>

  <!-- Toast for notifications -->
  <ion-toast
    [isOpen]="showToast"
    [message]="toastMessage"
    [duration]="3000"
    [color]="toastColor"
    (didDismiss)="onToastDismiss()">
  </ion-toast>
</ion-content>
