<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Movie App</ion-title>
    <ion-item slot="end">
      <ion-icon *ngIf="networkStatus" name="wifi-outline"></ion-icon>
      <ion-icon *ngIf="!networkStatus" name="globe-outline"></ion-icon>
      <ion-button (click)="handleLogOut()">
        <ion-icon name="log-out"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar placeholder="Search for a movie..." (ionInput)="filterMovies($event)"></ion-searchbar>
  </ion-toolbar>
  <ion-toolbar> <ion-chip (click)="filterByType('Running')" color="success">Running</ion-chip> <ion-chip (click)="filterByType('NRunning')" color="tertiary">Retired</ion-chip> <ion-chip (click)="filterByType('Reset')" color="warning">Reset</ion-chip></ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true" *ngIf="data.length !== 0; else loading">

  <ion-list class="movie-list">
    <ion-item
      *ngFor="let movie of filteredData"
      (click)="handleMovie(movie)"
      [detail]="false"
      [@fadeSlide]="movie.id">
      <ion-thumbnail slot="start" *ngIf="getMovieImage(movie) as photo">
        <img [src]="photo" alt="{{ movie.name }} poster">
      </ion-thumbnail>

      <ion-label>
        <h2>{{ movie.name }}</h2>
        <p>Rating: {{ movie.rating }}/10</p>
        <p *ngIf="movie.locationLabel">{{ movie.locationLabel }}</p>
      </ion-label>

      <ion-buttons slot="end">
        <ion-button fill="clear" color="medium" (click)="handleEditMovie(movie, $event)">
          <ion-icon name="create-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" color="primary" (click)="handleMovie(movie); $event.stopPropagation()">
          <ion-icon name="arrow-forward"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>

  <ion-infinite-scroll threshold="15%" (ionInfinite)="onIonInfinite($event)" *ngIf="!hasAll">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Loading more movies...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <ion-fab horizontal="end" vertical="bottom" slot="fixed">
    <ion-fab-button (click)="handleAddMovie()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>



<ng-template #loading>
  <div class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading movie details...</p>
  </div>
</ng-template>
