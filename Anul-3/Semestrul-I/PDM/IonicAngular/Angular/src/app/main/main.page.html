<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Movie App</ion-title>
    <ion-item slot="end">
      <ion-icon *ngIf="networkStatus" name="wifi-outline"></ion-icon>
      <ion-icon *ngIf="!networkStatus" name="globe-outline"></ion-icon>
      <ion-button (click)="handleLogOut()">
        <ion-icon name="log-out"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar placeholder="Search for a movie..." (ionInput)="filterMovies($event)"></ion-searchbar>
  </ion-toolbar>
  <ion-toolbar> <ion-chip (click)="filterByType('Running')" color="success">Running</ion-chip> <ion-chip (click)="filterByType('NRunning')" color="tertiary">Retired</ion-chip> <ion-chip (click)="filterByType('Reset')" color="warning">Reset</ion-chip></ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true" *ngIf="data.length !== 0; else loading">

  <ion-list class="movie-list">
    <ion-item *ngFor="let movie of filteredData">
      <ion-label>{{ movie.name }}</ion-label>
      <ion-button (click)="handleMovie(movie)" fill="clear">
        <ion-icon name="arrow-forward"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-infinite-scroll threshold="15%" (ionInfinite)="onIonInfinite($event)" *ngIf="!hasAll">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Loading more movies...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <ion-fab horizontal="end" vertical="bottom" slot="fixed">
    <ion-fab-button (click)="handleOpenAddMenu(true)">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>



<ng-template #loading>
  <div class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading movie details...</p>
  </div>
</ng-template>

<ion-modal [isOpen]="isOpen" (didDismiss)="handleOpenAddMenu(false)">
  <ng-template>
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Add a new movie</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="handleOpenAddMenu(false)">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <form [formGroup]="addForm" (ngSubmit)="saveMovie()">

        <ion-item>
          <ion-input
            label="Name"
            label-placement="stacked"
            placeholder="Enter movie name"
            formControlName="name"
            type="text">
          </ion-input>
        </ion-item>

        <!-- Rating -->
        <ion-item>
          <ion-input
            label="Rating"
            label-placement="stacked"
            placeholder="Enter movie ratin"
            formControlName="rating"
            type="number"
            step="0.1"
            max="5">
          </ion-input>
        </ion-item>

        <!-- Premier Date -->
        <ion-item>
          <ion-label>Premiere Date</ion-label>
          <ion-datetime-button datetime="premierDate"></ion-datetime-button>
          <ion-modal [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime
                id="premierDate"
              formControlName="premierDate"
              presentation="date"
              displayFormat="MMM DD, YYYY"
              pickerFormat="YYYY-MM-DD" >
              </ion-datetime>
            </ng-template>
          </ion-modal>
        </ion-item>


        <!-- Running -->
        <ion-item lines="none">
          <ion-label>Currently running?</ion-label>
          <ion-toggle formControlName="running"></ion-toggle>
        </ion-item>

        <!-- Submit -->
        <ion-button
          type="submit"
          [disabled]="addForm.invalid"
        >
          Save Movie
        </ion-button>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
