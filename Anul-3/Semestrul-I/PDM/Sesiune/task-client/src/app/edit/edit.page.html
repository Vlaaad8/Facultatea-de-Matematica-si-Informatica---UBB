<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Edit Task {{ task?.id }}</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="onCancel()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="onSave()" [disabled]="!task || isLoading">
        <ion-icon slot="icon-only" name="checkmark"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Loading indicator -->
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner></ion-spinner>
    <p>Loading task...</p>
  </div>

  <!-- Conflict warning -->
  <ion-card *ngIf="hasConflict && !isLoading" color="warning">
    <ion-card-header>
      <ion-card-title>Version Conflict</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      This task was modified by another user. You can choose to keep your version or use the server version.
    </ion-card-content>
  </ion-card>

  <!-- Server version (in case of conflict) -->
  <ion-card *ngIf="hasConflict && task?.serverText && !isLoading">
    <ion-card-header>
      <ion-card-title>Server Version</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>{{ task.serverText }}</p>
      <ion-button expand="block" (click)="useServerVersion()">Use Server Version</ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Local version (in case of conflict) -->
  <ion-card *ngIf="hasConflict && task?.localText && !isLoading">
    <ion-card-header>
      <ion-card-title>Your Version</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>{{ task.localText }}</p>
      <ion-button expand="block" (click)="useLocalVersion()">Use Your Version</ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Edit form -->
  <div class="edit-form" *ngIf="task && !isLoading">
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Task ID</ion-label>
        <ion-input [value]="task.id" readonly></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Tag</ion-label>
        <ion-input [value]="task.tag" readonly></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Text</ion-label>
        <ion-textarea
          [(ngModel)]="editedText"
          rows="6"
          placeholder="Enter task text...">
        </ion-textarea>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
