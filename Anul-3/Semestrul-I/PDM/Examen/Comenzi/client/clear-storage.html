<!DOCTYPE html>
<html>
<head>
    <title>Clear Storage</title>
</head>
<body>
    <h1>Clear Local Storage</h1>
    <button onclick="clearStorage()">Click aici pentru a șterge storage-ul</button>
    <p id="result"></p>

    <script>
        async function clearStorage() {
            // Clear localStorage
            localStorage.clear();

            // Clear Capacitor Preferences
            if (window.Capacitor && window.Capacitor.Plugins.Preferences) {
                await window.Capacitor.Plugins.Preferences.clear();
            }

            document.getElementById('result').innerHTML = 'Storage șters! Acum reîncarcă aplicația.';

            // Redirecționează după 2 secunde
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        }
    </script>
</body>
</html>
