plugins {
    id 'java'
    id 'jacoco'
    id 'jacoco-report-aggregation'
}

group = 'com.example'
version = '1.0-SNAPSHOT'
sourceCompatibility = 17

repositories {
    mavenCentral()
}

configure(rootProject) {
    dependencies {
        jacocoAggregation rootProject.subprojects
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    dependencies {
        implementation 'commons-cli:commons-cli:1.5.0'
        implementation 'commons-io:commons-io:2.11.0'
        implementation 'com.google.guava:guava:32.1.2-jre'
        implementation 'org.apache.logging.log4j:log4j-core:2.20.0'

        testImplementation platform('org.junit:junit-bom:5.9.1')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'junit:junit:4.13.1'
        testImplementation 'org.hamcrest:hamcrest:2.2'
        testImplementation 'org.mockito:mockito-core:5.5.0'
    }

    test {
        useJUnitPlatform()
        reports {
            junitXml.mergeReruns = true
        }
    }

    jacoco {
        toolVersion = "0.8.10"
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }
}

tasks.test.finalizedBy tasks.jacocoTestReport

task uploadCoverage(type: Exec, dependsOn: testCodeCoverageReport) {
    description = 'Uploads coverage data to Codacy.'
    commandLine 'bash', '-c', 'bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml'
}
