<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> <ion-icon (click)="handleMain()" name="arrow-back-outline"></ion-icon> Movie Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item *ngIf="movie; else loading">
    <ion-label>
      <h2>{{ movie.name }}</h2>
      <p>{{ movie.rating }}</p>
      <p>{{movie.premierDate}}</p>
      <p> Status: {{movie.running}}</p>
    </ion-label>

  </ion-item>
</ion-content>

<ng-template #loading>
  <div class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading movie details...</p>
  </div>
</ng-template>
