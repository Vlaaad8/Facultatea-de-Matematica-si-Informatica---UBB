<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Restaurant Orders
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Set Table Section -->
  <div class="container" *ngIf="!tableSet">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Set Your Table</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-label position="floating">Table Number</ion-label>
          <ion-input [(ngModel)]="table" type="text"></ion-input>
        </ion-item>
        <ion-button expand="block" (click)="setTable()" [disabled]="!table.trim()">
          Set Table
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Menu Section -->
  <div *ngIf="tableSet">
    <ion-card>
      <ion-card-header>
        <ion-card-subtitle>
          Table: {{table}}
          <ion-button size="small" color="danger" (click)="resetApp()" style="float: right;">
            Reset App
          </ion-button>
        </ion-card-subtitle>
      </ion-card-header>
    </ion-card>

    <!-- Loading Indicator -->
    <div *ngIf="isLoading" class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading menu...</p>
    </div>

    <!-- Menu Content -->
    <div *ngIf="!isLoading">
      <!-- Filter Segment -->
      <ion-segment [(ngModel)]="filterMode" (ionChange)="applyFilter()">
        <ion-segment-button value="all">
          <ion-label>All Items</ion-label>
        </ion-segment-button>
        <ion-segment-button value="ordered">
          <ion-label>Ordered Only</ion-label>
        </ion-segment-button>
      </ion-segment>

      <!-- Menu List -->
      <ion-list>
        <ion-item *ngFor="let item of filteredMenu" (click)="onItemClick(item)">
          <ion-label>
            <h2>{{item.name}}</h2>
            <p>Price: {{item.price}} lei</p>
            <p *ngIf="item.quantity && item.quantity > 0">Total: {{getTotalPrice(item)}} lei</p>
          </ion-label>

          <div slot="end" class="quantity-container">
            <!-- Submitting Indicator -->
            <ion-spinner *ngIf="item.isSubmitting" name="dots"></ion-spinner>

            <!-- Input for editing -->
            <ion-input
              *ngIf="item.isEditing && !item.isSubmitting"
              type="number"
              [(ngModel)]="item.quantity"
              (ionBlur)="confirmQuantity(item)"
              (keyup.enter)="confirmQuantity(item)"
              placeholder="0"
              class="quantity-input"
            ></ion-input>

            <!-- Display quantity -->
            <ion-text
              *ngIf="!item.isEditing && !item.isSubmitting"
              [color]="item.hasError ? 'danger' : 'dark'"
            >
              <strong>Qty: {{item.quantity || 0}}</strong>
            </ion-text>
          </div>
        </ion-item>
      </ion-list>

      <!-- Submit Button -->
      <ion-button expand="block" (click)="submitOrders()" class="submit-button">
        Submit Order
      </ion-button>
    </div>
  </div>
</ion-content>
